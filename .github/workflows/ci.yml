name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Lint, test, and build
        working-directory: apps/mobile/android
        run: ./gradlew ktlintCheck testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 60
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Rust framework and Swift bindings
        run: ./apps/mobile/ios/build-rust.sh --release

      - name: Test Swift package
        working-directory: apps/mobile/ios/AureliaCore
        run: swift test

      - name: Build unsigned iOS app
        run: |
          xcodebuild archive \
            -workspace apps/mobile/ios/Aurelia.xcworkspace \
            -scheme Aurelia \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ios.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p build/ios-payload/Payload
          cp -r build/ios.xcarchive/Products/Applications/Aurelia.app build/ios-payload/Payload/
          cd build/ios-payload
          zip -r ../Aurelia.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: build/Aurelia.ipa
          retention-days: 7
