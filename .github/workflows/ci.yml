name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Rust fmt)
        run: cargo fmt --check

      - name: Lint (ESLint)
        run: bunx eslint .

      - name: Verify structure
        run: ./scripts/verify-structure.sh

      - name: Verify generated artifacts
        run: bun run bindings:verify

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (Clippy)
        run: cargo clippy --workspace -- -D warnings

      - name: Test (JS)
        run: bun run test:js

      - name: Test (Rust)
        run: cargo test --workspace

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build Web (Release)
        run: bun run build:web:release

      - name: Upload Web Frontend
        uses: actions/upload-artifact@v4
        with:
          name: web-frontend
          path: apps/web/frontend/dist
          retention-days: 7

      - name: Upload Web Backend
        uses: actions/upload-artifact@v4
        with:
          name: web-backend
          path: target/release/aurelia-web-backend
          retention-days: 7

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: check-and-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build Desktop
        run: bun run build:desktop:release

      - name: Ad-hoc codesign (macOS)
        if: matrix.os == 'macos-latest'
        run: codesign --force --deep -s - apps/desktop/tauri/src-tauri/target/release/bundle/macos/*.app

      - name: Upload Artifacts (Linux)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            apps/desktop/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/tauri/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7

      - name: Upload Artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            apps/desktop/tauri/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/tauri/src-tauri/target/release/bundle/macos/*.app
          retention-days: 7

      - name: Upload Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            apps/desktop/tauri/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/tauri/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2

      - name: Add Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Generate Bindings
        run: bun run bindings:generate

      - name: Run Android Tests
        working-directory: apps/mobile/android
        run: ./gradlew testDebugUnitTest

      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  build-ios:
    name: Build iOS (Framework)
    runs-on: macos-26
    timeout-minutes: 45
    needs: check-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Add iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-ios-macabi x86_64-apple-ios-macabi aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Generate Bindings (Full)
        run: bun run bindings:generate:full

      - name: Build Rust Framework
        run: ./apps/mobile/ios/build-rust.sh --release

      - name: Run Swift Tests
        run: |
          cd apps/mobile/ios/AureliaCore
          swift test

      - name: Build iOS App (Unsigned)
        run: |
          xcodebuild archive \
            -workspace apps/mobile/ios/Aurelia.xcworkspace \
            -scheme Aurelia \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ios.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package iOS IPA
        run: |
          mkdir -p build/ios-payload/Payload
          cp -r build/ios.xcarchive/Products/Applications/Aurelia.app build/ios-payload/Payload/
          cd build/ios-payload
          zip -r ../Aurelia.ipa Payload

      - name: Build Mac Catalyst App (Unsigned)
        run: |
          xcodebuild archive \
            -workspace apps/mobile/ios/Aurelia.xcworkspace \
            -scheme Aurelia \
            -configuration Release \
            -destination "platform=macOS,variant=Mac Catalyst" \
            -archivePath build/macos.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Prepare Mac Catalyst App
        run: |
          mkdir -p build/mac-payload
          cp -r build/macos.xcarchive/Products/Applications/Aurelia.app build/mac-payload/

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcframework
          path: apps/mobile/ios/AureliaCore/AureliaCoreFFI.xcframework
          retention-days: 7

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/Aurelia.ipa
          retention-days: 7

      - name: Upload Mac Catalyst App
        uses: actions/upload-artifact@v4
        with:
          name: mac-catalyst-app
          path: build/mac-payload
          retention-days: 7
