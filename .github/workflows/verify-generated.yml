name: Verify Generated Artifacts

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-generated:
    name: Verify Generated (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify generated artifacts
        run: ./scripts/verify-generated.sh --skip-ios

      - name: Run core tests
        run: cargo test -p aurelia-core

      - name: Run API web tests
        run: cargo test -p aurelia-api --features web

  verify-ios-generated:
    name: Verify Generated (macOS + iOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Apple Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify generated artifacts (including iOS)
        run: ./scripts/verify-generated.sh --ios
