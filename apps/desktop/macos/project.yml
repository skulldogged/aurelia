name: AureliaMac
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    macOS: "26.0"
packages:
  AureliaCore:
    path: ../../mobile/ios/AureliaCore
targets:
  AureliaMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: AureliaMac
    info:
      path: AureliaMac/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurelia.macos
        PRODUCT_NAME: Aurelia
        SWIFT_VERSION: 6.0
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: AureliaCore
        product: AureliaCore
  AureliaMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests
    dependencies:
      - target: AureliaMac
schemes:
  AureliaMac:
    build:
      targets:
        AureliaMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AureliaMacTests
