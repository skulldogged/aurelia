[package]
name = "aurelia"
version = "0.1.0"
description = "A music player for Jellyfin"
authors = ["pupbrained"]
edition = "2024"

[lib]
name = "aurelia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
biquad = "0.5.0"
discord-rich-presence = "1"
rodio = { version = "0.21.1", default-features = false, features = [
  "playback",
  "symphonia-all",
] }
rustfft = "6.2"
tauri = { version = "2", features = [
  "protocol-asset",
  "macos-private-api",
  "devtools",
  "tray-icon",
] }
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aurelia-core = { path = "../../../../crates/aurelia-core", features = ["desktop"] }
aurelia-api = { path = "../../../../crates/aurelia-api", features = ["desktop"] }

# Missing dependencies
chrono = { version = "0.4.38", features = ["serde"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
  "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.22", features = ["derive", "function"] }
stream-download = { version = "0.22", features = ["reqwest-rustls"] }
souvlaki = { git = "https://github.com/skulldogged/souvlaki" }
raw-window-handle = "0.6"
