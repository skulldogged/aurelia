[package]
name = "aurelia-api"
version = "0.1.0"
edition = "2024"
description = "Aurelia API abstraction layer - runtime support and generated implementations"

[dependencies]
aurelia-api-macros = { path = "../aurelia-api-macros" }
aurelia-core = { path = "../aurelia-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.10", optional = true }

# Axum (for web + Electron backend builds)
axum = { version = "0.8", optional = true }
tokio = { version = "1", optional = true }
reqwest = { version = "0.12", optional = true }

[features]
default = []
web = ["axum", "tokio", "rand", "reqwest", "aurelia-core/discord"]

[dev-dependencies]
tempfile = "3.12"
