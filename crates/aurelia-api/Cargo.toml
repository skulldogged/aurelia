[package]
name = "aurelia-api"
version = "0.1.0"
edition = "2024"
description = "Aurelia API abstraction layer - runtime support and generated implementations"

[dependencies]
aurelia-api-macros = { path = "../aurelia-api-macros" }
aurelia-core = { path = "../aurelia-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.9", optional = true }

# Tauri (for desktop builds)
tauri = { version = "2", optional = true }
specta = { version = "=2.0.0-rc.22", optional = true }

# Axum (for web backend builds)
axum = { version = "0.8", optional = true }
tokio = { version = "1", optional = true }
reqwest = { version = "0.12", optional = true }

[features]
default = []
desktop = ["tauri", "specta", "rand", "reqwest", "aurelia-core/desktop"]
web = ["axum", "tokio", "rand", "reqwest"]

[dev-dependencies]
tempfile = "3.12"
