# Aurelia Sidecar Lyrics Daemon Configuration

# Jellyfin connection (optional but recommended for automatic path resolution)
jellyfin_url = "http://localhost:8096"
jellyfin_api_key = "your-jellyfin-api-key-here"

# Music library paths (optional, for file watching)
music_paths = ["/media/music", "/mnt/music"]

# HTTP server settings
bind = "0.0.0.0"
port = 8080

# Cache settings
cache_ttl_seconds = 3600
