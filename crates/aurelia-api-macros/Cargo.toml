[package]
name = "aurelia-api-macros"
version = "0.1.0"
edition = "2024"
description = "Procedural macros for Aurelia API generation"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits", "parsing"] }
darling = "0.23"
heck = "0.5"
