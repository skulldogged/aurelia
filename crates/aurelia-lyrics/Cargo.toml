[package]
name = "aurelia-lyrics"
version = "0.1.0"
edition = "2021"

[features]
specta = ["dep:specta"]
uniffi = ["dep:uniffi"]
json = []

[dependencies]
serde = { version = "1", features = ["derive"] }
quick-xml = { version = "0.39", features = ["serialize"] }
thiserror = "2"
regex = "1"
anyhow = "1"
specta = { version = "=2.0.0-rc.22", features = ["derive", "function"], optional = true }
uniffi = { version = "0.31.0", features = ["tokio"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
