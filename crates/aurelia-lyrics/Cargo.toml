[package]
name = "aurelia-lyrics"
version = "0.1.0"
edition = "2021"

[features]
uniffi = ["dep:uniffi"]

[dependencies]
serde = { version = "1", features = ["derive"] }
quick-xml = { version = "0.39", features = ["serialize"] }
thiserror = "2"
regex = "1"
anyhow = "1"
uniffi = { version = "0.31.0", features = ["tokio"], optional = true }
