[workspace]
resolver = "2"
members = ["apps/desktop/tauri/src-tauri", "apps/web/backend", "crates/aurelia-core", "crates/aurelia-api", "crates/aurelia-api-macros", "crates/uniffi-bindgen"]

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"

[profile.local-release]
inherits = "release"
lto = "off"
codegen-units = 64
incremental = true
