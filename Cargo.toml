[workspace]
resolver = "2"
members = ["apps/desktop/gpui", "apps/desktop/tauri/src-tauri", "apps/web/backend", "crates/aurelia-core", "crates/aurelia-api", "crates/aurelia-api-macros", "crates/uniffi-bindgen", "crates/aurelia-lyrics", "crates/aurelia-sidecar-daemon"]

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

